[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evacusim"
version = "0.1.0"
description = "Reusable LLM-driven evacuation simulation framework (JuPedSim + Concordia)"
requires-python = ">=3.10"
dependencies = [
    "jupedsim>=1.0.0",
    "numpy>=1.24.0",
    "shapely>=2.0.0",
    "networkx>=3.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0.0",
    "azure-ai-inference>=1.0.0b9",
    "azure-core>=1.29.0",
    "aiohttp>=3.9.0",
    "rich>=13.0.0",
    "sentence-transformers>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10", "pre-commit>=3"]

[tool.setuptools.packages.find]
where = ["."]
include = ["evacusim*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade, simplify.
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = [
    "E501",  # line length is the formatter's job; long strings/comments are tolerated
    "B023",  # closures here are called within the loop iteration (escalators/system.py)
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
